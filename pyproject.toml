[project]
name = "weatherstar"
version = "0.1.0"
description = "Weather Star simulator (The Weather Channel's Weather Star 4000 & 3000)"
readme = "README.md"
authors = [
    { name = "Bobby Ball", email = "bobbyjball3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cachetools>=5.3",
    "ephem>=4.1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pygame==2.6.1",
    "structlog>=26.1.0",
    "tomli>=2.0 ; python_full_version < '3.11'",
]

[project.scripts]
weatherstar = "weatherstar.cli:main"
# Optional Jellyfin TV streamer; see docs/STREAMING.md. Deleting the
# weatherstar.streaming package (and this line) removes it without touching the
# rest of the app.
weatherstar-stream = "weatherstar.streaming.cli:main"

# External plugins register here (built-ins register via the built-in registry).
[project.entry-points."weatherstar.plugins"]
placeholder = "weatherstar.plugins"

[dependency-groups]
dev = [
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "vulture>=2.11",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
# The vulture whitelist is a parsed-only file of intentionally undefined names.
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["weatherstar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--continue-on-collection-errors --junitxml=reports/junit.xml"
markers = [
    "integration: exercises a real ffmpeg encoder; requires ffmpeg on PATH.",
]

[tool.coverage.run]
source = ["src/weatherstar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: rendering is exercised headlessly via populated-data screen tests;
# coverage currently sits around 85%. Raise fail_under as coverage grows.
fail_under = 85

[tool.coverage.xml]
output = "coverage.xml"

[tool.vulture]
# Run via `task deadcode`; report unused code across the package and tests.
paths = ["src/weatherstar", "tests", "vulture_whitelist.py"]
min_confidence = 60
# Plugin classes are registered by decorator + name, not by reference.
ignore_decorators = [
    "@plugin",
    "@memoize",
    "@dataclass",
    "@pytest.fixture",
    "@pytest.mark.parametrize",
]
# Pytest collects test functions by naming convention.
ignore_names = ["test_*"]

